name: AIEO Opt-in Model Draft
on:
  pull_request:
    paths:
      - '.github/workflows/aieo-model-draft.yml'
      - 'aieo/**'
      - 'scripts/aieo-model-*.mjs'
      - 'scripts/aieo-publish-draft*.mjs'
  workflow_dispatch:
    inputs:
      task:
        description: A bounded request for one change to FeedbackWidget
        required: true
        type: string
      approve_external_source_sharing:
        description: I explicitly approve sending this one source file to OpenRouter
        required: true
        type: boolean
        default: false

concurrency:
  group: aieo-model-draft-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-tests:
    name: AIEO model privacy and patch safety preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run model adapter and independent security unit tests (mock only)
        run: node --test scripts/aieo-model-provider.test.mjs scripts/aieo-model-security.test.mjs scripts/aieo-model-gates.test.mjs scripts/aieo-model-e2e.test.mjs scripts/aieo-model-chain.test.mjs scripts/aieo-publish-draft.test.mjs scripts/aieo-workflow-policy.test.mjs
      - name: Assert no source changed
        run: git diff --exit-code -- components/FeedbackWidget.tsx

  create-model-draft:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_external_source_sharing == true
    needs: policy-tests
    name: Manual source-approved model proposal into Draft PR
    environment: aieo-ai
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Request one bounded model suggestion and audit its exact source diff
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_ID: ${{ vars.AIEO_MODEL_ID }}
          AIEO_MODEL_ENABLED: 'true'
          AIEO_SOURCE_SHARING_APPROVED: 'true'
          AIEO_MODEL_TASK: ${{ inputs.task }}
          AIEO_MODEL_APPLY: '1'
        run: |
          set -euo pipefail
          node scripts/aieo-model-proposal.mjs
          node scripts/aieo-model-gates.mjs qa
          node scripts/aieo-model-security.mjs
          node scripts/aieo-model-gates.mjs reviewer
          git diff --check
          test "$(git diff --name-only)" = 'components/FeedbackWidget.tsx'
      - name: Independently verify application build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aieo_build_only
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npx next typegen
          npx tsc --noEmit
          npm run build
      - name: Publish independently verified candidate as Draft PR only
        env:
          GH_TOKEN: ${{ github.token }}
          AIEO_PUBLISH_MODE: model
          AIEO_MODEL_ENABLED: 'true'
          AIEO_SOURCE_SHARING_APPROVED: 'true'
        run: node scripts/aieo-publish-draft.mjs
