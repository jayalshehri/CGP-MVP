name: AIEO Opt-in Model Draft
on:
  pull_request:
    paths:
      - '.github/workflows/aieo-model-draft.yml'
      - 'aieo/**'
      - 'scripts/aieo-model-*.mjs'
      - 'scripts/aieo-publish-draft*.mjs'
  workflow_dispatch:
    inputs:
      task:
        description: A bounded request for one change to FeedbackWidget
        required: true
        type: string
      approve_external_source_sharing:
        description: I explicitly approve sending this one source file to OpenRouter
        required: true
        type: boolean
        default: false
      approved_source_sha256:
        description: SHA-256 of the exact FeedbackWidget source approved for OpenRouter
        required: true
        type: string

concurrency:
  group: aieo-model-draft-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-tests:
    name: AIEO model privacy and patch safety preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run model adapter and independent security unit tests (mock only)
        run: node --test scripts/aieo-model-provider.test.mjs scripts/aieo-model-ref.test.mjs scripts/aieo-model-security.test.mjs scripts/aieo-model-gates.test.mjs scripts/aieo-model-e2e.test.mjs scripts/aieo-model-chain.test.mjs scripts/aieo-publish-draft.test.mjs scripts/aieo-workflow-policy.test.mjs
      - name: Assert no source changed
        run: git diff --exit-code -- components/FeedbackWidget.tsx

  create-model-draft:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_external_source_sharing == true
    needs: policy-tests
    name: Source-approved Developer - isolated runner
    environment: aieo-ai
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Request one bounded model suggestion with scoped provider credential
        env:
          BASH_ENV: ''
          NODE_OPTIONS: ''
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_TLS_REJECT_UNAUTHORIZED: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_ID: ${{ vars.AIEO_MODEL_ID }}
          AIEO_MODEL_ENABLED: 'true'
          AIEO_SOURCE_SHARING_APPROVED: 'true'
          AIEO_APPROVED_SOURCE_SHA256: ${{ inputs.approved_source_sha256 }}
          AIEO_MODEL_TASK: ${{ inputs.task }}
          AIEO_MODEL_APPLY: '1'
        run: |
          set -euo pipefail
          node scripts/aieo-model-proposal.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cgp-model-developer
          path: |
            components/FeedbackWidget.tsx
            aieo-output/model-proposal.json
          if-no-files-found: error
          retention-days: 1

  model-qa:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_external_source_sharing == true
    needs: create-model-draft
    name: QA - isolated runner without provider secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cgp-model-developer
          path: .
      - name: Independently run model QA without provider credential
        env:
          BASH_ENV: ''
          NODE_OPTIONS: ''
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
        run: node scripts/aieo-model-gates.mjs qa
      - uses: actions/upload-artifact@v4
        with:
          name: cgp-model-qa
          path: |
            components/FeedbackWidget.tsx
            aieo-output/model-proposal.json
            aieo-output/model-qa.json
          if-no-files-found: error
          retention-days: 1

  model-security:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_external_source_sharing == true
    needs: model-qa
    name: Security - isolated runner without provider secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cgp-model-qa
          path: .
      - name: Independently run model Security without provider credential
        env:
          BASH_ENV: ''
          NODE_OPTIONS: ''
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
        run: node scripts/aieo-model-security.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cgp-model-security
          path: |
            components/FeedbackWidget.tsx
            aieo-output/model-proposal.json
            aieo-output/model-qa.json
            aieo-output/model-security.json
          if-no-files-found: error
          retention-days: 1

  model-reviewer:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_external_source_sharing == true
    needs: model-security
    name: Reviewer - isolated runner without provider secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cgp-model-security
          path: .
      - name: Independently run model Reviewer without provider credential
        env:
          BASH_ENV: ''
          NODE_OPTIONS: ''
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
        run: node scripts/aieo-model-gates.mjs reviewer
      - name: Attest candidate diff scope after independent reviews
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'components/FeedbackWidget.tsx'
      - uses: actions/upload-artifact@v4
        with:
          name: cgp-model-reviewer
          path: |
            components/FeedbackWidget.tsx
            aieo-output/model-proposal.json
            aieo-output/model-qa.json
            aieo-output/model-security.json
            aieo-output/model-reviewer.json
          if-no-files-found: error
          retention-days: 1

  model-build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_external_source_sharing == true
    needs: model-reviewer
    name: Build - separate runner for verified candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cgp-model-reviewer
          path: .
      - name: Independently verify application build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aieo_build_only
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npx next typegen
          npx tsc --noEmit
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cgp-model-build
          path: |
            components/FeedbackWidget.tsx
            aieo-output/model-proposal.json
            aieo-output/model-qa.json
            aieo-output/model-security.json
            aieo-output/model-reviewer.json
          if-no-files-found: error
          retention-days: 1

  model-publisher:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_external_source_sharing == true
    needs: model-build
    name: Draft-only publisher - separate write-scoped runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: cgp-model-build
          path: .
      - name: Publish independently verified candidate as Draft PR only
        env:
          BASH_ENV: ''
          NODE_OPTIONS: ''
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
          NODE_EXTRA_CA_CERTS: ''
          NODE_TLS_REJECT_UNAUTHORIZED: '1'
          GH_TOKEN: ${{ github.token }}
          AIEO_PUBLISH_MODE: model
          AIEO_MODEL_ENABLED: 'true'
          AIEO_SOURCE_SHARING_APPROVED: 'true'
        run: node scripts/aieo-publish-draft.mjs
