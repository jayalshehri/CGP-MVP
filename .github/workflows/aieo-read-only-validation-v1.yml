name: AIEO Read-Only Validation v1
on:
  push:
    branches:
      - aieo/read-only-validation-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate bounded repair proposal without applying changes
        run: |
          node --check scripts/aieo-autonomous-v1.mjs
          node scripts/aieo-autonomous-v1.mjs
          test -z "$(git status --porcelain)"
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generate Next.js types
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build without production credentials
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aieo_build_only
        run: npm run build
      - name: Verify no tracked source changes
        run: git diff --exit-code
