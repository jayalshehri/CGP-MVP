name: AIEO Synthetic Draft PR Pilot
on:
  workflow_dispatch:
    inputs:
      approve_synthetic_pr:
        description: 'I approve creating a synthetic-only Draft PR, without app changes, merge or production deployment'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  synthetic-preflight:
    name: Synthetic-only scope and reference gate
    if: github.ref == 'refs/heads/main' && inputs.approve_synthetic_pr == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify execution contract
        env:
          APPROVED: ${{ inputs.approve_synthetic_pr }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REPOSITORY" = 'jayalshehri/CGP-MVP'
          test "$APPROVED" = 'true'
          echo 'PASS: fixed synthetic evidence only; no source/model access'

  publish-draft:
    name: Create synthetic GitHub Actions bot Draft PR
    needs: synthetic-preflight
    environment: aieo-ai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish synthetic proof as a Draft PR, never merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REPOSITORY" = 'jayalshehri/CGP-MVP'
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test -z "$(git status --porcelain)"
          branch="aieo/synthetic-draft-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="docs/aieo-evidence/synthetic-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          git checkout -b "$branch"
          mkdir -p docs/aieo-evidence
          printf '# AIEO synthetic Draft PR proof\n\nThis is fixed, synthetic test data only.\nGitHub Actions run ID: %s\nNo application source was modified or sent to a model.\nNo merge or production deployment is requested.\n' "$GITHUB_RUN_ID" > "$evidence"
          git add -- "$evidence"
          test "$(git diff --cached --name-only)" = "$evidence"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'test(aieo): add synthetic-only Draft PR proof'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$branch" \
            --title "AIEO synthetic-only bot Draft PR proof #${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --body "Synthetic-only workflow proof. Fixed test data; no real code changes, no OpenRouter/source transmission, no merge and no production deployment. Human review required.")"
          # Attest GitHub\u0027s actual response, not only that the CLI accepted --draft.
          pr_json="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json isDraft,baseRefName,headRefName,files)"
          jq -e --arg branch "$branch" --arg evidence "$evidence" \
            \u0027.isDraft == true and .baseRefName == "main" and .headRefName == $branch and (.files | length) == 1 and .files[0].path == $evidence\u0027 \
            <<<"$pr_json" >/dev/null
          echo "PASS: GitHub confirmed a Draft PR limited to the single synthetic evidence file"
