name: AIEO Synthetic Model Evaluation v16
on:
  push:
    branches: [aieo/synthetic-model-eval-v16]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate model response policy
        run: node --test scripts/aieo-model-eval-v16.test.mjs
      - name: Prepare review-only task
        run: |
          node scripts/aieo-model-eval-v16.mjs
          git diff --exit-code
