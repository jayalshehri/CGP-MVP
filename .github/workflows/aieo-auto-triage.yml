name: AIEO Automatic CI Triage (safe mode)
on:
  push:
    branches:
      - aieo/phase4-autonomous-readonly-gates
    paths:
      - .github/workflows/aieo-auto-triage.yml
      - scripts/aieo-developer-proposal.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aieo-auto-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Produce proposal from last completed real CI
        env:
          AIEO_SOURCE: github
          AIEO_TARGET_BRANCH: aieo/phase4-live-developer-triage
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/aieo-developer-proposal.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aieo-automatic-readonly-report
          path: aieo-reports/developer-proposal.md
          retention-days: 7
