name: AIEO Multi-Agent Foundation
on:
  workflow_dispatch:
  push:
    branches: [aieo/multi-agent-foundation]
    paths:
      - 'aieo/**'
      - 'scripts/aieo-*.mjs'
      - '.github/workflows/aieo-multi-agent.yml'
  pull_request:
    paths:
      - 'aieo/**'
      - 'scripts/aieo-*.mjs'
      - '.github/workflows/aieo-multi-agent.yml'
permissions:
  contents: read

jobs:
  orchestrator-preflight:
    name: AIEO orchestrator preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run negative, safety and handoff tests
        run: node --test scripts/aieo-agent.test.mjs scripts/aieo-handoff.test.mjs scripts/aieo-e2e.test.mjs scripts/aieo-model-provider.test.mjs scripts/aieo-workflow-policy.test.mjs
      - name: Verify real source in read-only mode
        run: node scripts/aieo-runner.mjs
      - name: Ensure source unchanged
        run: git diff --exit-code -- components/FeedbackWidget.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aieo-orchestrator-report
          path: aieo-output/multi-agent-report.json
          if-no-files-found: ignore
          retention-days: 7

  developer:
    name: AIEO Developer Agent
    needs: orchestrator-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/aieo-role.mjs developer
      - uses: actions/upload-artifact@v4
        with:
          name: aieo-developer
          path: aieo-output/developer.json
          retention-days: 7

  qa:
    name: AIEO QA Agent
    needs: developer
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: aieo-developer
          path: aieo-output
      - run: node scripts/aieo-role.mjs qa
      - uses: actions/upload-artifact@v4
        with:
          name: aieo-qa
          path: aieo-output/qa.json
          retention-days: 7

  security:
    name: AIEO Security Agent
    needs: developer
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: aieo-developer
          path: aieo-output
      - run: node scripts/aieo-role.mjs security
      - uses: actions/upload-artifact@v4
        with:
          name: aieo-security
          path: aieo-output/security.json
          retention-days: 7

  reviewer:
    name: AIEO Reviewer Agent
    needs: [qa, security]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: aieo-*
          path: aieo-output
          merge-multiple: true
      - run: node scripts/aieo-role.mjs reviewer
      - uses: actions/upload-artifact@v4
        with:
          name: aieo-reviewer
          path: aieo-output/reviewer.json
          retention-days: 7
