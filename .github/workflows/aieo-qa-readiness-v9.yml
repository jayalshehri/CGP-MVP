name: AIEO QA Live Readiness v9 (No Real Calls)
on:
  push:
    branches: [aieo/qa-live-gate-v9]
permissions:
  contents: read
jobs:
  readiness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test fail-closed QA readiness and gateway mock
        run: |
          node --test scripts/aieo-qa-readiness-v9.test.mjs scripts/aieo-gateway-v8.test.mjs
          git diff --exit-code
