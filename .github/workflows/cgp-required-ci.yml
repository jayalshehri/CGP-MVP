name: CGP Required CI
on:
  workflow_dispatch:
  push:
    branches: [aieo/feedback-boundary-fix]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Data Office failure and role routing regressions
        run: |
          node scripts/test-role-home.mjs
          node scripts/test-data-office-release-scope.mjs
          node --test scripts/test-data-office-mutations.mjs scripts/test-nudee-mutations.mjs scripts/test-third-party-assessment.mjs scripts/test-tpra.mjs
      - name: Build with synthetic values
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aieo_build_only
        run: npm run build
