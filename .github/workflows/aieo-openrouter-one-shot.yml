name: AIEO OpenRouter One-Shot Synthetic QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aieo-one-shot-free-qa
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aieo-free-test
    timeout-minutes: 3
    steps:
      - name: One synthetic, read-only OpenRouter request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AIEO_FREE_MODEL_ID: ${{ vars.AIEO_FREE_MODEL_ID }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.OPENROUTER_API_KEY;
          const model=process.env.AIEO_FREE_MODEL_ID;
          if (!key || !/^[a-z0-9._-]+\/[a-z0-9._-]+:free$/i.test(model||'')) {
            console.error('BLOCKED: QA secret or free model configuration missing');
            process.exit(1);
          }
          const timeout=AbortSignal.timeout(10000);
          let response;
          try {
            response=await fetch('https://openrouter.ai/api/v1/chat/completions',{
              method:'POST',signal:timeout,
              headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
              body:JSON.stringify({model,stream:false,max_tokens:64,temperature:0,
                messages:[{role:'user',content:'Synthetic test only. Reply with exactly 42: what is 6 times 7?'}]})
            });
          } catch { console.error('FAIL: Provider connection error');process.exit(1); }
          if(!response.ok){console.error('FAIL: Provider rejected request, HTTP '+response.status);process.exit(1);}
          const raw=await response.text();
          if(raw.length>12000){console.error('FAIL: Oversized response');process.exit(1);}
          let result;
          try {result=JSON.parse(raw);}catch {console.error('FAIL: Invalid JSON');process.exit(1);}
          const value=result?.choices?.[0]?.message?.content;
          if(typeof value!=='string'||value.trim()!=='42'){console.error('FAIL: Unexpected answer');process.exit(1);}
          console.log('PASS: Single synthetic free-model response verified. No source or production data sent.');
          NODE
