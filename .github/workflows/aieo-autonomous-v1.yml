name: AIEO Autonomous Developer v1 (bounded pilot)
on:
  push:
    branches: [aieo/autonomous-developer-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Strict approved real-file change preflight
        run: |
          node --check scripts/aieo-autonomous-v1.mjs
          node scripts/aieo-autonomous-v1.mjs
      - name: Package and static checks
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aieo_build_only
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build
  guarded-draft:
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    environment: aieo-ai
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare unique repair branch without modifying main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # CI runner is isolated from production resources. No production secrets passed.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp scripts/aieo-autonomous-v1.mjs /tmp/aieo-autonomous-v1.mjs
          git fetch origin main
          git checkout -B "aieo/repair-feedback-${GITHUB_RUN_ID}" origin/main
          AIEO_APPLY=1 node /tmp/aieo-autonomous-v1.mjs
          if git diff --quiet; then echo 'No changes needed'; exit 0; fi
          test "$(git diff --name-only)" = 'components/FeedbackWidget.tsx'
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_aieo_build_only npm ci
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_aieo_build_only npm run lint
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_aieo_build_only npx tsc --noEmit
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_aieo_build_only npm run build
          git add -- components/FeedbackWidget.tsx
          git commit -m 'fix(aieo): prevent partial feedback control route matches'
          git -c credential.helper= push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/aieo/repair-feedback-${GITHUB_RUN_ID}"
          gh pr create --draft --base main --head "aieo/repair-feedback-${GITHUB_RUN_ID}" --title "AIEO: bounded feedback route repair" --body "Autonomous pilot on a strictly approved single-file patch. CI lint, typecheck, and build passed. Human review required. No merge or deployment."
